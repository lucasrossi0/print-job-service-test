spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printservice}
spring.datasource.username=${DB_USER:printservice}
spring.datasource.password=${DB_PASSWORD:printservice}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=always
management.endpoint.info.access=unrestricted
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true
info.app.name=print-job-service
info.app.version=0.0.1-SNAPSHOT
info.app.database=PostgreSQL